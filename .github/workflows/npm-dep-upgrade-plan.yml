name: npm-dep-upgrade-plan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tools/npm-dep-upgrade-plan
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm-dep-paths dependencies for integration test
        working-directory: tools/npm-dep-paths
        run: npm ci --ignore-scripts
      - name: Install npm-dep-audit dependencies for integration test
        working-directory: tools/npm-dep-audit
        run: npm ci --ignore-scripts
      - name: Install npm-dep-audit CLI
        working-directory: tools/npm-dep-audit
        run: npm install --global . --ignore-scripts
      - name: Install npm-dep-versions dependencies
        working-directory: tools/npm-dep-versions
        run: npm ci --ignore-scripts
      - name: Install npm-dep-versions CLI
        working-directory: tools/npm-dep-versions
        run: npm install --global . --ignore-scripts
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        env:
          NPM_DEP_AUDIT_INTEGRATION: '1'
        run: npm test
