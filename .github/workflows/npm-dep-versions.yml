name: npm-dep-versions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tools/npm-dep-versions
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Provision pinned npm test runtimes
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/versions-npm12" --ignore-scripts --no-audit --no-fund npm@12.1.0
          node -e 'const fs=require("node:fs"),p=require("node:path");fs.appendFileSync(process.env.GITHUB_ENV,"NPM_DEP_UPGRADE_E2E_NPM_CLI="+p.join(process.env.RUNNER_TEMP,"versions-npm12/node_modules/npm/bin/npm-cli.js")+"\nNPM_DEP_VERSIONS_REQUIRE_RUNTIMES=1\n")'
          if [ "$RUNNER_OS" != Windows ]; then
            npm install --prefix "$RUNNER_TEMP/versions-npm11" --ignore-scripts --no-audit --no-fund npm@11.10.0
            node -e 'const fs=require("node:fs"),p=require("node:path");fs.appendFileSync(process.env.GITHUB_ENV,"NPM_DEP_UPGRADE_E2E_COMPAT_NPM_CLI="+p.join(process.env.RUNNER_TEMP,"versions-npm11/node_modules/npm/bin/npm-cli.js")+"\n")'
          fi
      - name: Run tests
        run: npm test
